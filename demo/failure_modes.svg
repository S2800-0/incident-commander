  <text x="60" y="1868" font-size="18" font-weight="700" fill="#F0F4FA">Every avoided operational action is compute and pipeline time that was not spent.</text>

  <!-- Three big numbers -->
  <g>
    <text x="60"  y="1930" font-size="46" font-weight="800" fill="#62DE80">38%</text>
    <text x="60"  y="1965" font-size="12" fill="#DAE2EC">probes avoided vs "check everything"</text>
    <text x="60"  y="1985" font-size="11" fill="#8CA0B4" font-family="Menlo, monospace">9 of 24 catalog probes not run</text>
  </g>
  <g>
    <text x="380" y="1930" font-size="46" font-weight="800" fill="#62DE80">4</text>
    <text x="380" y="1965" font-size="12" fill="#DAE2EC">deploy pipelines NOT triggered</text>
    <text x="380" y="1985" font-size="11" fill="#8CA0B4" font-family="Menlo, monospace">each = 1 avoided FP-rollback pipeline</text>
  </g>
  <g>
    <text x="700" y="1930" font-size="46" font-weight="800" fill="#62DE80">0</text>
    <text x="700" y="1965" font-size="12" fill="#DAE2EC">LLM tokens burned for graded output</text>
    <text x="700" y="1985" font-size="11" fill="#8CA0B4" font-family="Menlo, monospace">harness runs deterministic</text>
  </g>

  <!-- Right-side framing note -->
  <text x="1050" y="1925" font-size="12" fill="#8CA0B4" font-style="italic">Not a green-metrics claim.</text>
  <text x="1050" y="1945" font-size="12" fill="#8CA0B4" font-style="italic">A structural side-effect of</text>
  <text x="1050" y="1965" font-size="12" fill="#8CA0B4" font-style="italic">evidence-driven, bounded,</text>
  <text x="1050" y="1985" font-size="12" fill="#8CA0B4" font-style="italic">verifiable autonomy.</text>
  <text x="1050" y="2005" font-size="11" fill="#62DE80">docs/SUSTAINABILITY.md</text>
</svg>
