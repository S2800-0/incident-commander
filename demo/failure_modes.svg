<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2050" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2050" fill="#F7F8FA"/>

  <!-- Title band -->
  <rect x="0" y="0" width="1600" height="140" fill="#FFFFFF"/>
  <rect x="0" y="139" width="1600" height="1" fill="#CBD5E1"/>
  <text x="60" y="60" font-size="28" font-weight="800" fill="#0F172A">Industry failure modes → shipped mechanisms</text>
  <text x="60" y="95" font-size="15" fill="#64748B">11 documented failure modes in agentic-AI DevOps. Each maps to a shipped module with a code path. Blue rows are from the positioning PDF; gray rows are additional from the broader industry literature.</text>
  <text x="60" y="120" font-size="12" fill="#94A3B8">Companion to docs/SUSTAINABILITY.md §4 · Incident Commander · Team Cairo · 2026.09</text>

  <!-- Accent stripe right side -->
  <rect x="1594" y="0" width="6" height="140" fill="#049FD9"/>

  <!-- Column headers -->
  <rect x="40" y="170" width="760" height="46" rx="4" fill="#E2E8F0"/>
  <rect x="820" y="170" width="740" height="46" rx="4" fill="#DCFCE7"/>
  <text x="60" y="200" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">INDUSTRY FAILURE MODE  ·  SOURCE</text>
  <text x="840" y="200" font-size="12" font-weight="700" fill="#166534" letter-spacing="1">OUR SHIPPED MECHANISM  ·  CODE PATH</text>

  <!-- ============================================================= -->
  <!-- Rows: 11 failure modes, alternating background                 -->
  <!-- ============================================================= -->

  <!-- Row style: each row is 155px tall, gap of 10                    -->

  <!-- 1. AI-driven change velocity (PDF) -->
  <g>
    <rect x="40"  y="230" width="760" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="230" width="740" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="230" width="6"   height="140" fill="#049FD9"/>
    <rect x="820" y="230" width="6"   height="140" fill="#16A34A"/>

    <text x="65" y="257" font-size="10" font-weight="700" fill="#049FD9" letter-spacing="1">1  ·  PDF</text>
    <text x="65" y="288" font-size="17" font-weight="700" fill="#0F172A">AI-driven change velocity</text>
    <text x="65" y="313" font-size="13" fill="#475569">Faster changes → more operational changes → higher incident probability</text>
    <text x="65" y="332" font-size="13" fill="#475569">→ recovery must scale with change velocity.</text>
    <text x="65" y="358" font-size="11" fill="#94A3B8" font-style="italic">source: Grafana / Microsoft agentic-DevOps analysis</text>

    <text x="845" y="257" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="288" font-size="17" font-weight="700" fill="#0F172A">Verification loop + auto-revert</text>
    <text x="845" y="313" font-size="13" fill="#475569">Every action is followed by a real recovery check.</text>
    <text x="845" y="332" font-size="13" fill="#475569">Failure demotes provenance and reverts within the envelope.</text>
    <text x="845" y="358" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/verification.py</text>
  </g>

  <!-- 2. Signal-to-noise / alert fatigue (PDF) -->
  <g>
    <rect x="40"  y="380" width="760" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="380" width="740" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="380" width="6"   height="140" fill="#049FD9"/>
    <rect x="820" y="380" width="6"   height="140" fill="#16A34A"/>

    <text x="65" y="407" font-size="10" font-weight="700" fill="#049FD9" letter-spacing="1">2  ·  PDF</text>
    <text x="65" y="438" font-size="17" font-weight="700" fill="#0F172A">Signal-to-noise / alert fatigue</text>
    <text x="65" y="463" font-size="13" fill="#475569">"Check everything" pattern under telemetry overload.</text>
    <text x="65" y="482" font-size="13" fill="#475569">The problem is not signal volume — it's which evidence is worth looking at.</text>
    <text x="65" y="508" font-size="11" fill="#94A3B8" font-style="italic">source: Grafana observability research</text>

    <text x="845" y="407" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="438" font-size="17" font-weight="700" fill="#0F172A">VoI + Expected Information Gain probe selection</text>
    <text x="845" y="463" font-size="13" fill="#475569">argmax(info_gain − λ·cost) — 38% of catalog probes avoided.</text>
    <text x="845" y="482" font-size="13" fill="#475569">Cost is a first-class term, not an afterthought.</text>
    <text x="845" y="508" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/voi.py · ic/probe.py</text>
  </g>

  <!-- 3. Unsafe autonomous decisions (PDF) -->
  <g>
    <rect x="40"  y="530" width="760" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="530" width="740" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="530" width="6"   height="140" fill="#049FD9"/>
    <rect x="820" y="530" width="6"   height="140" fill="#16A34A"/>

    <text x="65" y="557" font-size="10" font-weight="700" fill="#049FD9" letter-spacing="1">3  ·  PDF</text>
    <text x="65" y="588" font-size="17" font-weight="700" fill="#0F172A">Unsafe autonomous decisions</text>
    <text x="65" y="613" font-size="13" fill="#475569">Confident ≠ correct. A system can act on a reasonable hypothesis</text>
    <text x="65" y="632" font-size="13" fill="#475569">and still be wrong. The dangerous edge is Hypothesis → Action.</text>
    <text x="65" y="658" font-size="11" fill="#94A3B8" font-style="italic">source: Microsoft / arXiv AI-SRE literature</text>

    <text x="845" y="557" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="588" font-size="17" font-weight="700" fill="#0F172A">OPA policy gate + evidence-sufficiency check</text>
    <text x="845" y="613" font-size="13" fill="#475569">Confidence ≠ Evidence Sufficiency ≠ Authorization ≠ Successful Recovery.</text>
    <text x="845" y="632" font-size="13" fill="#475569">Each boundary is a separate structural check.</text>
    <text x="845" y="658" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">policy/incident/action.rego · ic/policy.py</text>
  </g>

  <!-- Divider -->
  <text x="60" y="710" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">ADDITIONAL FAILURE MODES  ·  BROADER INDUSTRY LITERATURE</text>
  <line x1="480" y1="705" x2="1560" y2="705" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 4. Auto-remediation cascades -->
  <g>
    <rect x="40"  y="720" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="720" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="720" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="720" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="746" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">4</text>
    <text x="65" y="775" font-size="15" font-weight="700" fill="#0F172A">Auto-remediation cascades / retry storms</text>
    <text x="65" y="799" font-size="12" fill="#475569">An autonomous fix amplifies the incident when the hypothesis is wrong.</text>
    <text x="65" y="822" font-size="11" fill="#94A3B8" font-style="italic">source: Google SRE book §22 · Meta postmortems</text>

    <text x="845" y="746" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="775" font-size="15" font-weight="700" fill="#0F172A">Bounded envelope + auto-revert</text>
    <text x="845" y="799" font-size="12" fill="#475569">5% traffic, 60s, auto-revert. Revert fires at first "not recovered" signal.</text>
    <text x="845" y="822" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/verification.py + policy envelope</text>
  </g>

  <!-- 5. Confidence miscalibration -->
  <g>
    <rect x="40"  y="850" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="850" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="850" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="850" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="876" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">5</text>
    <text x="65" y="905" font-size="15" font-weight="700" fill="#0F172A">Confidence miscalibration</text>
    <text x="65" y="929" font-size="12" fill="#475569">LLM / agent reports high confidence on a wrong answer.</text>
    <text x="65" y="952" font-size="11" fill="#94A3B8" font-style="italic">source: arXiv AI-SRE · LLM-uncertainty papers</text>

    <text x="845" y="876" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="905" font-size="15" font-weight="700" fill="#0F172A">Posterior cap 0.94 · Brier · reliability diagram</text>
    <text x="845" y="929" font-size="12" fill="#475569">Confidence measured against real outcomes, not asserted.</text>
    <text x="845" y="952" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/reasoner.py · ic/harness.py</text>
  </g>

  <!-- 6. Prompt injection / evidence poisoning -->
  <g>
    <rect x="40"  y="980" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="980" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="980" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="980" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="1006" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">6</text>
    <text x="65" y="1035" font-size="15" font-weight="700" fill="#0F172A">Prompt injection / evidence poisoning</text>
    <text x="65" y="1059" font-size="12" fill="#475569">Attacker crafts a log line that redirects the agent's action.</text>
    <text x="65" y="1082" font-size="11" fill="#94A3B8" font-style="italic">source: OWASP LLM Top-10 2024 · RAI containment literature</text>

    <text x="845" y="1006" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="1035" font-size="15" font-weight="700" fill="#0F172A">No-tool-access adjudicator + anti-halluc. filter</text>
    <text x="845" y="1059" font-size="12" fill="#475569">Evidence enters as delimited/typed/hashed data — never as instruction.</text>
    <text x="845" y="1082" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">RAI.md §3 · ic/dynamic_triage.py</text>
  </g>

  <!-- 7. Explainability gap -->
  <g>
    <rect x="40"  y="1110" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="1110" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="1110" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="1110" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="1136" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">7</text>
    <text x="65" y="1165" font-size="15" font-weight="700" fill="#0F172A">Explainability gap</text>
    <text x="65" y="1189" font-size="12" fill="#475569">Action fired — no one can explain why. Regulator-visible risk.</text>
    <text x="65" y="1212" font-size="11" fill="#94A3B8" font-style="italic">source: EU AI Act §13 · ISO/IEC 42001 auditability</text>

    <text x="845" y="1136" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="1165" font-size="15" font-weight="700" fill="#0F172A">Merkle + Ed25519 sealed evidence chain</text>
    <text x="845" y="1189" font-size="12" fill="#475569">Every cited leaf + policy decision + verification result sealed.</text>
    <text x="845" y="1212" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/evidence_chain.py · verify.py</text>
  </g>

  <!-- 8. Blast-radius uncertainty -->
  <g>
    <rect x="40"  y="1240" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="1240" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="1240" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="1240" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="1266" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">8</text>
    <text x="65" y="1295" font-size="15" font-weight="700" fill="#0F172A">Blast-radius uncertainty</text>
    <text x="65" y="1319" font-size="12" fill="#475569">Agent doesn't know how far its action reaches.</text>
    <text x="65" y="1342" font-size="11" fill="#94A3B8" font-style="italic">source: Argo Rollouts docs · Netflix Chaos Engineering</text>

    <text x="845" y="1266" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="1295" font-size="15" font-weight="700" fill="#0F172A">Hard-coded safety envelope + policy enforcement</text>
    <text x="845" y="1319" font-size="12" fill="#475569">max_traffic_pct, max_duration_s, auto_revert — enforced by OPA.</text>
    <text x="845" y="1342" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/voi.py · policy/incident/action.rego</text>
  </g>

  <!-- 9. Compound automation risk -->
  <g>
    <rect x="40"  y="1370" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="1370" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="1370" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="1370" width="6"   height="120" fill="#F59E0B"/>

    <text x="65" y="1396" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">9</text>
    <text x="65" y="1425" font-size="15" font-weight="700" fill="#0F172A">Compound automation risk</text>
    <text x="65" y="1449" font-size="12" fill="#475569">Multiple autonomous systems reacting to each other's actions.</text>
    <text x="65" y="1472" font-size="11" fill="#94A3B8" font-style="italic">source: LinkedIn IAT paper · Datadog Bits AI postmortems</text>

    <text x="845" y="1396" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1">ROADMAP + STAGED</text>
    <text x="845" y="1425" font-size="15" font-weight="700" fill="#0F172A">Staged autonomy ladder + shadow mode</text>
    <text x="845" y="1449" font-size="12" fill="#475569">L3→L2 promotions only for provably safe classes. Shadow before selective NoOps.</text>
    <text x="845" y="1472" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">RAI.md §2.2 · ROADMAP.md stages 5, 9</text>
  </g>

  <!-- 10. Benchmark contamination -->
  <g>
    <rect x="40"  y="1500" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="1500" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="1500" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="1500" width="6"   height="120" fill="#F59E0B"/>

    <text x="65" y="1526" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">10</text>
    <text x="65" y="1555" font-size="15" font-weight="700" fill="#0F172A">Benchmark contamination</text>
    <text x="65" y="1579" font-size="12" fill="#475569">Accuracy claims measured on the same corpus the system was tuned on.</text>
    <text x="65" y="1602" font-size="11" fill="#94A3B8" font-style="italic">source: ML reproducibility literature</text>

    <text x="845" y="1526" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1">PARTIAL + ROADMAP</text>
    <text x="845" y="1555" font-size="15" font-weight="700" fill="#0F172A">Slice-based headline · real-postmortem corpus (stage 8)</text>
    <text x="845" y="1579" font-size="12" fill="#475569">Hard-slice-only headline + ROADMAP stage 8. Limitation named on slide 8.</text>
    <text x="845" y="1602" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/harness.py · ROADMAP.md stage 8</text>
  </g>

  <!-- 11. Feedback-loop breakdown -->
  <g>
    <rect x="40"  y="1630" width="760" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="820" y="1630" width="740" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="40"  y="1630" width="6"   height="120" fill="#94A3B8"/>
    <rect x="820" y="1630" width="6"   height="120" fill="#16A34A"/>

    <text x="65" y="1656" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">11</text>
    <text x="65" y="1685" font-size="15" font-weight="700" fill="#0F172A">Feedback-loop breakdown</text>
    <text x="65" y="1709" font-size="12" fill="#475569">Agent acts but gets no signal back — cannot verify or learn.</text>
    <text x="65" y="1732" font-size="11" fill="#94A3B8" font-style="italic">source: AI safety literature on closed-loop control</text>

    <text x="845" y="1656" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">SHIPPED</text>
    <text x="845" y="1685" font-size="15" font-weight="700" fill="#0F172A">Verification loop is the closed loop</text>
    <text x="845" y="1709" font-size="12" fill="#475569">Post-action signal check, sealed regardless of outcome.</text>
    <text x="845" y="1732" font-size="11" fill="#0EA5E9" font-family="Menlo, monospace">ic/verification.py</text>
  </g>

  <!-- ============================================================= -->
